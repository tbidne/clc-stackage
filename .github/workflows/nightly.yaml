name: nightly
on:
  push:
    branches:
      - master
      - snapshot-url

  pull_request:
    branches:
      - master

  schedule:
    # Every day at 00:00 UTC.
    #
    # https://crontab.guru
    - cron: '0 0 * * *'

  workflow_dispatch:
jobs:
  trigger-build:
    uses: ./.github/workflows/runner.yaml
    with:
      snapshot: 'nightly'
